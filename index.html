<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巴士方向顯示</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .route-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .route-no {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a73e8;
    }
    .direction {
      font-size: 1.1rem;
      margin-top: 6px;
      color: #333;
    }
    .operator {
      font-size: 0.85rem;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <h2>方向顯示範例</h2>
  <div id="list"></div>

  <script>
    // 範例資料
    const routes = [
      { company: "NLB", route: "1", dest: "梅窩碼頭" },
      { company: "NLB", route: "11", dest: "大澳" },
      { company: "NLB", route: "23", dest: "昂坪" },
      { company: "KMB", route: "1A", dest: "尖沙咀碼頭" },
      { company: "CTB", route: "5B", dest: "銅鑼灣" },
      { company: "MTR", route: "K51", dest: "大欖" },
      { company: "NLB", route: "B4", dest: "港珠澳大橋香港口岸" },
    ];

    /**
     * 根據營辦商決定是否加「往」字
     * 嶼巴 (NLB) → 不加「往」
     * 其他 → 加「往」
     */
    function formatDirection(company, dest) {
      if (company === "NLB") {
        return dest;                 // 嶼巴：直接顯示終點站名
      }
      return `往 ${dest}`;           // 其他公司：加「往」
    }

    // 渲染列表
    const list = document.getElementById("list");
    routes.forEach(r => {
      const card = document.createElement("div");
      card.className = "route-card";
      card.innerHTML = `
        <div class="route-no">${r.route}</div>
        <div class="direction">${formatDirection(r.company, r.dest)}</div>
        <div class="operator">${r.company}</div>
      `;
      list.appendChild(card);
    });
  </script>

</body>
</html>
