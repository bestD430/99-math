<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士到站時間看板</title>
  <style>
    :root {
      --primary: #e63946;
      --primary-dark: #c1121f;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 740px; margin: 0 auto; padding: 18px 14px 40px; }
    header { text-align: center; margin-bottom: 22px; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .step-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 0.4px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step-num {
      background: var(--primary);
      color: white;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }
    label { display: block; font-size: 0.88rem; font-weight: 500; margin-bottom: 5px; }
    input[type="text"], select {
      width: 100%;
      padding: 11px 13px;
      font-size: 1.05rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-family: inherit;
      background: white;
    }
    input[type="text"]:focus, select:focus { border-color: var(--primary); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 18px; font-size: 0.95rem; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: var(--text); font-size: 0.85rem; padding: 8px 12px; }
    .btn-secondary:hover { background: #e2e8f0; }
    .operator-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .op-btn {
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .op-btn:hover { border-color: var(--primary); background: #fff5f5; }
    .op-btn.active {
      border-color: var(--primary);
      background: #fff5f5;
      box-shadow: 0 0 0 3px rgba(230,57,70,0.12);
    }
    .op-btn small { display: block; font-weight: 400; font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .option-list { display: flex; flex-direction: column; gap: 7px; max-height: 300px; overflow-y: auto; }
    .option-item {
      padding: 11px 13px;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.12s;
      background: white;
    }
    .option-item:hover { border-color: var(--primary); background: #fff5f5; }
    .option-item .main { font-weight: 600; font-size: 0.92rem; }
    .option-item .sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .eta-board {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 14px;
      padding: 18px;
    }
    .eta-header { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .eta-route { font-size: 1.5rem; font-weight: 700; color: #f87171; }
    .eta-dest { font-size: 0.95rem; color: #94a3b8; margin-top: 2px; }
    .eta-stop { font-size: 0.9rem; margin-top: 6px; color: #fff; }
    .eta-co { display: inline-block; background: #334155; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; margin-top: 6px; }
    .eta-list { display: flex; flex-direction: column; gap: 8px; }
    .eta-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.06); padding: 12px 14px; border-radius: 10px;
    }
    .eta-time { font-size: 1.35rem; font-weight: 700; color: #4ade80; font-variant-numeric: tabular-nums; }
    .eta-time.soon { color: #fbbf24; }
    .eta-time.arrived { color: #f87171; }
    .eta-rmk { font-size: 0.82rem; color: #94a3b8; text-align: right; }
    .eta-empty { text-align: center; padding: 24px 10px; color: #94a3b8; }
    .loading { text-align: center; padding: 16px; color: var(--muted); }
    .error {
      background: #fef2f2; color: #b91c1c; padding: 10px 12px;
      border-radius: 8px; border: 1px solid #fecaca; font-size: 0.88rem; margin-top: 8px;
    }
    .hidden { display: none !important; }
    .toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .refresh-info { font-size: 0.78rem; color: #64748b; margin-top: 10px; }
    footer { text-align: center; margin-top: 24px; font-size: 0.78rem; color: var(--muted); }
    footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚌 香港巴士到站時間看板</h1>
      <p>九巴／城巴／嶼巴／專線小巴／港鐵巴士</p>
    </header>

    <div class="card" id="step0">
      <div class="step-title"><span class="step-num">1</span> 選擇營運商</div>
      <div class="operator-grid">
        <div class="op-btn active" data-co="kmb" onclick="selectOperator('kmb')">九巴 / 龍運<small>KMB / LWB</small></div>
        <div class="op-btn" data-co="ctb" onclick="selectOperator('ctb')">城巴<small>Citybus</small></div>
        <div class="op-btn" data-co="nlb" onclick="selectOperator('nlb')">嶼巴<small>New Lantao Bus</small></div>
        <div class="op-btn" data-co="gmb" onclick="selectOperator('gmb')">專線小巴<small>Green Minibus</small></div>
        <div class="op-btn" data-co="mtrbus" onclick="selectOperator('mtrbus')">港鐵巴士<small>MTR Bus</small></div>
      </div>
      <div id="opNote" style="font-size:0.82rem;color:var(--muted);margin-top:6px;">已選擇：九巴／龍運</div>
    </div>

    <div class="card" id="step1">
      <div class="step-title"><span class="step-num">2</span> 輸入路線號碼</div>
      <label for="routeInput">路線號碼</label>
      <input type="text" id="routeInput" placeholder="例如 1A、102、960、K12" autocomplete="off" autocapitalize="characters">
      <div id="gmbRegion" class="hidden" style="margin-top:10px;">
        <label>小巴區域</label>
        <select id="gmbRegionSelect">
          <option value="HKI">港島 (HKI)</option>
          <option value="KLN">九龍 (KLN)</option>
          <option value="NT">新界 (NT)</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnSearchRoute" onclick="searchRoute()">查詢路線</button>
      <div id="routeError" class="error hidden"></div>
    </div>

    <div class="card hidden" id="step2">
      <div class="step-title"><span class="step-num">3</span> 選擇方向／服務</div>
      <div id="directionList" class="option-list"></div>
      <div class="toolbar"><button class="btn btn-secondary" onclick="goBack(1)">← 返回</button></div>
    </div>

    <div class="card hidden" id="step3">
      <div class="step-title"><span class="step-num">4</span> 選擇車站</div>
      <div id="stopList" class="option-list"></div>
      <div id="stopLoading" class="loading hidden">載入車站中...</div>
      <div class="toolbar"><button class="btn btn-secondary" onclick="goBack(2)">← 返回</button></div>
    </div>

    <div class="card hidden" id="step4">
      <div class="step-title"><span class="step-num">5</span> 預計到站時間</div>
      <div id="etaBoard" class="eta-board">
        <div class="eta-header">
          <div class="eta-route" id="etaRoute">—</div>
          <div class="eta-dest" id="etaDest">—</div>
          <div class="eta-stop" id="etaStopName">—</div>
          <div class="eta-co" id="etaCo">—</div>
        </div>
        <div id="etaList" class="eta-list"></div>
        <div class="refresh-info" id="refreshInfo"></div>
      </div>
      <div class="toolbar">
        <button class="btn btn-secondary" onclick="goBack(3)">← 返回車站</button>
        <button class="btn btn-secondary" onclick="fetchETA()">🔄 刷新</button>
        <button class="btn btn-secondary" id="btnAutoRefresh" onclick="toggleAutoRefresh()">▶ 自動刷新</button>
      </div>
      <div id="etaError" class="error hidden"></div>
    </div>

    <footer>
      資料來源：data.gov.hk 開放數據（九巴、城巴、嶼巴、專線小巴、港鐵巴士）<br>
      到站時間僅供參考，實際以現場為準
    </footer>
  </div>

  <script>
    const CO_NAMES = {
      kmb: '九巴／龍運',
      ctb: '城巴',
      nlb: '嶼巴',
      gmb: '專線小巴',
      mtrbus: '港鐵巴士'
    };

    let state = {
      co: 'kmb',
      route: null,
      bound: null,
      serviceType: null,
      directionLabel: null,
      destTc: null,
      stopId: null,
      stopName: null,
      stopSeq: null,
      nlbRouteId: null,
      gmbRouteId: null,
      gmbRouteSeq: null,
      dirPath: null,
      autoRefresh: false,
      refreshTimer: null,
      mtrRawStop: null
    };

    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }
    function setError(id, msg) {
      const el = document.getElementById(id);
      if (msg) { el.textContent = msg; show(el); }
      else hide(el);
    }

    function selectOperator(co) {
      state.co = co;
      document.querySelectorAll('.op-btn').forEach(b => b.classList.toggle('active', b.dataset.co === co));
      document.getElementById('opNote').textContent = '已選擇：' + CO_NAMES[co];
      const gmbBox = document.getElementById('gmbRegion');
      if (co === 'gmb') show(gmbBox); else hide(gmbBox);
      hide(document.getElementById('step2'));
      hide(document.getElementById('step3'));
      hide(document.getElementById('step4'));
      show(document.getElementById('step1'));
    }

    function goBack(toStep) {
      stopAutoRefresh();
      hide(document.getElementById('step2'));
      hide(document.getElementById('step3'));
      hide(document.getElementById('step4'));
      if (toStep <= 1) {
        show(document.getElementById('step1'));
        state.route = null; state.bound = null; state.stopId = null;
      } else if (toStep === 2) {
        show(document.getElementById('step2'));
        state.stopId = null;
      } else if (toStep === 3) {
        show(document.getElementById('step3'));
      }
    }

    async function searchRoute() {
      const input = document.getElementById('routeInput').value.trim().toUpperCase();
      if (!input) { setError('routeError', '請輸入路線號碼'); return; }
      setError('routeError', null);
      const btn = document.getElementById('btnSearchRoute');
      btn.disabled = true; btn.textContent = '查詢中...';

      try {
        if (state.co === 'kmb') await searchKMB(input);
        else if (state.co === 'ctb') await searchCTB(input);
        else if (state.co === 'nlb') await searchNLB(input);
        else if (state.co === 'gmb') await searchGMB(input);
        else if (state.co === 'mtrbus') await searchMTRBus(input);
      } catch (e) {
        setError('routeError', e.message || '查詢失敗，請稍後再試');
        console.error(e);
      } finally {
        btn.disabled = false; btn.textContent = '查詢路線';
      }
    }

    async function searchKMB(route) {
      const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/');
      if (!res.ok) throw new Error('無法取得九巴路線資料');
      const json = await res.json();
      const matches = json.data.filter(r => r.route.toUpperCase() === route);
      if (matches.length === 0) throw new Error('找不到九巴／龍運路線「' + route + '」');
      state.route = route;
      renderDirections(matches.map(m => ({
        bound: m.bound,
        serviceType: m.service_type,
        orig: m.orig_tc,
        dest: m.dest_tc,
        label: m.orig_tc + ' → ' + m.dest_tc,
        sub: (m.bound === 'O' ? '去程' : '回程') + ' · 服務類型 ' + m.service_type
      })));
    }

    async function searchCTB(route) {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/CTB/' + route);
      if (!res.ok) throw new Error('找不到城巴路線「' + route + '」');
      const json = await res.json();
      if (!json.data) throw new Error('找不到城巴路線「' + route + '」');
      const dirs = [];
      for (const dir of ['inbound', 'outbound']) {
        try {
          const sRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/' + route + '/' + dir);
          const sJson = await sRes.json();
          if (sJson.data && sJson.data.length > 0) {
            dirs.push({
              bound: dir === 'outbound' ? 'O' : 'I',
              serviceType: '1',
              dirPath: dir,
              orig: json.data.orig_tc || '',
              dest: json.data.dest_tc || '',
              label: dir === 'outbound'
                ? (json.data.orig_tc + ' → ' + json.data.dest_tc)
                : (json.data.dest_tc + ' → ' + json.data.orig_tc),
              sub: dir === 'outbound' ? '去程 (Outbound)' : '回程 (Inbound)'
            });
          }
        } catch (e) {}
      }
      if (dirs.length === 0) throw new Error('城巴路線「' + route + '」暫無可用方向資料');
      state.route = route;
      renderDirections(dirs);
    }

    async function searchNLB(route) {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list');
      if (!res.ok) throw new Error('無法取得嶼巴路線資料');
      const json = await res.json();
      const matches = (json.routes || []).filter(r => r.routeNo.toUpperCase() === route);
      if (matches.length === 0) throw new Error('找不到嶼巴路線「' + route + '」');
      state.route = route;
      renderDirections(matches.map(m => ({
        bound: 'O',
        serviceType: '1',
        nlbRouteId: m.routeId,
        orig: '',
        dest: m.routeName_c,
        label: m.routeName_c,
        sub: '路線 ID: ' + m.routeId
      })));
    }

    async function searchGMB(route) {
      const region = document.getElementById('gmbRegionSelect').value;
      const res = await fetch('https://data.etagmb.gov.hk/route/' + region + '/' + route);
      if (!res.ok) throw new Error('找不到' + region + '區專線小巴「' + route + '」');
      const json = await res.json();
      const data = json.data || [];
      if (data.length === 0) throw new Error('找不到' + region + '區專線小巴「' + route + '」');
      state.route = route;
      const dirs = [];
      data.forEach(item => {
        (item.directions || []).forEach(d => {
          dirs.push({
            bound: String(d.route_seq),
            serviceType: '1',
            gmbRouteId: item.route_id,
            gmbRouteSeq: d.route_seq,
            orig: d.orig_tc,
            dest: d.dest_tc,
            label: d.orig_tc + ' → ' + d.dest_tc,
            sub: item.description_tc || ('方向 ' + d.route_seq)
          });
        });
      });
      if (dirs.length === 0) throw new Error('此小巴路線暫無方向資料');
      renderDirections(dirs);
    }

    async function searchMTRBus(route) {
      state.route = route;
      renderDirections([{
        bound: 'O',
        serviceType: '1',
        orig: '',
        dest: route,
        label: '港鐵巴士 ' + route,
        sub: '點選後直接查詢所有車站到站時間'
      }]);
    }

    function renderDirections(list) {
      const el = document.getElementById('directionList');
      el.innerHTML = '';
      list.forEach(m => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML = '<div class="main">' + m.label + '</div><div class="sub">' + (m.sub || '') + '</div>';
        div.onclick = () => selectDirection(m);
        el.appendChild(div);
      });
      hide(document.getElementById('step1'));
      show(document.getElementById('step2'));
    }

    async function selectDirection(m) {
      state.bound = m.bound;
      state.serviceType = m.serviceType || '1';
      state.directionLabel = m.label;
      state.destTc = m.dest || '';
      state.nlbRouteId = m.nlbRouteId || null;
      state.gmbRouteId = m.gmbRouteId || null;
      state.gmbRouteSeq = m.gmbRouteSeq || null;
      state.dirPath = m.dirPath || (m.bound === 'O' ? 'outbound' : 'inbound');

      hide(document.getElementById('step2'));
      show(document.getElementById('step3'));
      document.getElementById('stopList').innerHTML = '';
      show(document.getElementById('stopLoading'));

      try {
        let stops = [];
        if (state.co === 'kmb') stops = await loadStopsKMB();
        else if (state.co === 'ctb') stops = await loadStopsCTB();
        else if (state.co === 'nlb') stops = await loadStopsNLB();
        else if (state.co === 'gmb') stops = await loadStopsGMB();
        else if (state.co === 'mtrbus') stops = await loadStopsMTRBus();
        renderStops(stops);
      } catch (e) {
        document.getElementById('stopList').innerHTML = '<div class="error">' + e.message + '</div>';
      } finally {
        hide(document.getElementById('stopLoading'));
      }
    }

    async function loadStopsKMB() {
      const dirPath = state.bound === 'O' ? 'outbound' : 'inbound';
      const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' + state.route + '/' + dirPath + '/' + state.serviceType);
      if (!res.ok) throw new Error('無法取得九巴車站列表');
      const json = await res.json();
      const stops = [];
      for (const s of (json.data || [])) {
        try {
          const sRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop/' + s.stop);
          const sJson = await sRes.json();
          stops.push({ seq: s.seq, stopId: s.stop, name: (sJson.data && sJson.data.name_tc) || s.stop });
        } catch (e) {
          stops.push({ seq: s.seq, stopId: s.stop, name: s.stop });
        }
      }
      return stops.sort((a, b) => Number(a.seq) - Number(b.seq));
    }

    async function loadStopsCTB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/' + state.route + '/' + state.dirPath);
      if (!res.ok) throw new Error('無法取得城巴車站列表');
      const json = await res.json();
      const stops = [];
      for (const s of (json.data || [])) {
        try {
          const sRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/' + s.stop);
          const sJson = await sRes.json();
          stops.push({ seq: s.seq, stopId: s.stop, name: (sJson.data && sJson.data.name_tc) || s.stop });
        } catch (e) {
          stops.push({ seq: s.seq, stopId: s.stop, name: s.stop });
        }
      }
      return stops.sort((a, b) => Number(a.seq) - Number(b.seq));
    }

    async function loadStopsNLB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=' + state.nlbRouteId);
      if (!res.ok) throw new Error('無法取得嶼巴車站列表');
      const json = await res.json();
      return (json.stops || []).map((s, i) => ({
        seq: i + 1,
        stopId: s.stopId,
        name: s.stopName_c
      }));
    }

    async function loadStopsGMB() {
      const res = await fetch('https://data.etagmb.gov.hk/route-stop/' + state.gmbRouteId + '/' + state.gmbRouteSeq);
      if (!res.ok) throw new Error('無法取得小巴車站列表');
      const json = await res.json();
      const stops = (json.data && json.data.route_stops) || json.data || [];
      return stops.map(s => ({
        seq: s.stop_seq,
        stopId: s.stop_id,
        name: s.name_tc || s.name_en || s.stop_id
      }));
    }

    async function loadStopsMTRBus() {
      const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: 'zh', routeName: state.route })
      });
      if (!res.ok) throw new Error('無法取得港鐵巴士資料');
      const json = await res.json();
      if (json.routeStatus === '3' || !(json.busStop || []).length) {
        throw new Error(json.routeStatusRemarkTitle || '此港鐵巴士路線目前停止服務或無資料');
      }
      return (json.busStop || []).map((s, i) => {
        let name = '';
        if (typeof s.busStopName === 'string') name = s.busStopName;
        else if (s.busStopName && s.busStopName.zh) name = s.busStopName.zh;
        else if (typeof s.busStopNameName === 'string') name = s.busStopNameName;
        else if (s.busStopNameName && s.busStopNameName.zh) name = s.busStopNameName.zh;

        return {
          seq: i + 1,
          stopId: s.busStopId || String(i),
          name: name || ('車站 ' + (i + 1)),
          raw: s
        };
      });
    }

    function renderStops(stops) {
      const list = document.getElementById('stopList');
      list.innerHTML = '';
      if (!stops.length) {
        list.innerHTML = '<div class="error">沒有找到車站</div>';
        return;
      }
      stops.forEach(s => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML = '<div class="main">' + s.seq + '. ' + s.name + '</div>';
        div.onclick = () => selectStop(s);
        list.appendChild(div);
      });
    }

    function selectStop(s) {
      state.stopId = s.stopId;
      state.stopName = s.name;
      state.stopSeq = s.seq;
      state.mtrRawStop = s.raw || null;
      hide(document.getElementById('step3'));
      show(document.getElementById('step4'));
      document.getElementById('etaRoute').textContent = state.route;
      document.getElementById('etaDest').textContent = state.directionLabel;
      document.getElementById('etaStopName').textContent = '車站：' + s.name;
      document.getElementById('etaCo').textContent = CO_NAMES[state.co];
      fetchETA();
    }

    async function fetchETA() {
      if (!state.stopId && state.co !== 'mtrbus') return;
      setError('etaError', null);
      const listEl = document.getElementById('etaList');
      listEl.innerHTML = '<div class="eta-empty">載入中...</div>';

      try {
        let etas = [];
        if (state.co === 'kmb') etas = await fetchETA_KMB();
        else if (state.co === 'ctb') etas = await fetchETA_CTB();
        else if (state.co === 'nlb') etas = await fetchETA_NLB();
        else if (state.co === 'gmb') etas = await fetchETA_GMB();
        else if (state.co === 'mtrbus') etas = await fetchETA_MTRBus();
        renderETAList(etas);
      } catch (e) {
        setError('etaError', e.message || '載入失敗');
        listEl.innerHTML = '';
        console.error(e);
      }
    }

    async function fetchETA_KMB() {
      const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/eta/' + state.stopId + '/' + state.route + '/' + state.serviceType);
      if (!res.ok) throw new Error('無法取得到站時間');
      const json = await res.json();
      return (json.data || [])
        .filter(e => e.dir === state.bound && e.eta)
        .map(e => ({ eta: e.eta, rmk: e.rmk_tc || '' }))
        .sort((a, b) => new Date(a.eta) - new Date(b.eta));
    }

    async function fetchETA_CTB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/' + state.stopId + '/' + state.route);
      if (!res.ok) throw new Error('無法取得到站時間');
      const json = await res.json();
      const dir = state.bound === 'O' ? 'O' : 'I';
      return (json.data || [])
        .filter(e => e.dir === dir && e.eta)
        .map(e => ({ eta: e.eta, rmk: e.rmk_tc || e.rmk || '' }))
        .sort((a, b) => new Date(a.eta) - new Date(b.eta));
    }

    async function fetchETA_NLB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=' + state.nlbRouteId + '&stopId=' + state.stopId + '&language=zh');
      if (!res.ok) throw new Error('無法取得到站時間');
      const json = await res.json();
      return (json.estimatedArrivals || [])
        .filter(e => e.estimatedArrivalTime)
        .map(e => ({
          eta: e.estimatedArrivalTime.replace(' ', 'T') + '+08:00',
          rmk: e.routeVariantName || ''
        }))
        .sort((a, b) => new Date(a.eta) - new Date(b.eta));
    }

    async function fetchETA_GMB() {
      const res = await fetch('https://data.etagmb.gov.hk/eta/route-stop/' + state.gmbRouteId + '/' + state.gmbRouteSeq + '/' + state.stopId);
      if (!res.ok) throw new Error('無法取得到站時間');
      const json = await res.json();
      const data = json.data || {};
      const etas = [];
      const arr = data.eta || data.etas || (Array.isArray(data) ? data : []);
      (Array.isArray(arr) ? arr : []).forEach(e => {
        if (e.timestamp || e.eta || e.estimated_arrival) {
          etas.push({
            eta: e.timestamp || e.eta || e.estimated_arrival,
            rmk: e.remarks_tc || e.remark || ''
          });
        }
      });
      if (etas.length === 0 && data.data) {
        (data.data || []).forEach(e => {
          if (e.timestamp) etas.push({ eta: e.timestamp, rmk: e.remarks_tc || '' });
        });
      }
      return etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
    }

    async function fetchETA_MTRBus() {
      const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: 'zh', routeName: state.route })
      });
      if (!res.ok) throw new Error('無法取得到站時間');
      const json = await res.json();
      const stop = (json.busStop || []).find(s => (s.busStopId || '') === state.stopId) || state.mtrRawStop;
      if (!stop) return [];
      return (stop.bus || []).map(b => {
        const sec = parseInt(b.arrivalTimeInSecond, 10);
        const etaDate = new Date(Date.now() + (isNaN(sec) ? 0 : sec * 1000));
        return {
          eta: etaDate.toISOString(),
          rmk: b.arrivalTimeText || ''
        };
      });
    }

    function renderETAList(etas) {
      const listEl = document.getElementById('etaList');
      if (!etas || etas.length === 0) {
        listEl.innerHTML = '<div class="eta-empty">暫無預計到站時間<br><small>（可能是非服務時間或最後班次已過）</small></div>';
        document.getElementById('refreshInfo').textContent = '最後更新：' + new Date().toLocaleTimeString('zh-HK');
        return;
      }
      listEl.innerHTML = '';
      const now = new Date();
      etas.slice(0, 6).forEach(e => {
        const etaDate = new Date(e.eta);
        const diffMin = Math.round((etaDate - now) / 60000);
        let timeStr, cls = '';
        if (diffMin <= 0) { timeStr = '即將到達'; cls = 'arrived'; }
        else if (diffMin <= 2) { timeStr = diffMin + ' 分鐘'; cls = 'soon'; }
        else { timeStr = diffMin + ' 分鐘'; }
        const clock = etaDate.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
        const item = document.createElement('div');
        item.className = 'eta-item';
        item.innerHTML = '<div class="eta-time ' + cls + '">' + timeStr + '</div><div class="eta-rmk">' + clock + (e.rmk ? '<br>' + e.rmk : '') + '</div>';
        listEl.appendChild(item);
      });
      document.getElementById('refreshInfo').textContent =
        '資料時間：' + new Date().toLocaleTimeString('zh-HK') + ' · 可開啟自動刷新（每30秒）';
    }

    function toggleAutoRefresh() {
      if (state.autoRefresh) {
        stopAutoRefresh();
      } else {
        state.autoRefresh = true;
        document.getElementById('btnAutoRefresh').textContent = '⏸ 停止自動刷新';
        state.refreshTimer = setInterval(fetchETA, 30000);
        fetchETA();
      }
    }

    function stopAutoRefresh() {
      state.autoRefresh = false;
      if (state.refreshTimer) { clearInterval(state.refreshTimer); state.refreshTimer = null; }
      const btn = document.getElementById('btnAutoRefresh');
      if (btn) btn.textContent = '▶ 自動刷新';
    }

    document.getElementById('routeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchRoute();
    });
  </script>
</body>
</html>
