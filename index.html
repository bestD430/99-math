<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港巴士到站時間</title>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }

    /* Search input area */
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }

    /* Results list */
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    
    .result-num {
      font-size: 1.725rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    
    /* 路線牌 house color */
    .plate-kmb { background: #E4002B; color: #fff; }          /* 九巴紅 */
    .plate-lwb { background: #F15A22; color: #fff; }          /* 龍運橙 */
    .plate-ctb { background: #FFD100; color: #1a1a1a; }       /* 城巴黃 */
    .plate-nlb { background: #007A3D; color: #fff; }          /* 嶼巴綠 */
    .plate-gmb { background: #00A651; color: #fff; }          /* 小巴綠 */
    .plate-mtrbus { background: #0077C8; color: #fff; }       /* 港鐵藍 */
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .error-state {
      text-align: center;
      padding: 24px 20px;
      color: var(--red);
      font-size: 0.9rem;
    }

    /* Keypad */
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 10px;
      user-select: none;
    }
    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      flex: 1;
      max-width: 48px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.05rem;
      background: #d8dce0;
      color: #1c1c1e;
      flex: 0 0 42px;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Sub pages */
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }

    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-right: 36px;
    }

    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }
    .stop-arrow { color: #c7c7cc; }

    /* ETA board */
    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    
    .eta-route-num {
      font-size: 2.1rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .eta-route-num.plate-kmb { background: #E4002B; color: #fff; }
    .eta-route-num.plate-lwb { background: #F15A22; color: #fff; }
    .eta-route-num.plate-ctb { background: #FFD100; color: #1a1a1a; }
    .eta-route-num.plate-nlb { background: #007A3D; color: #fff; }
    .eta-route-num.plate-gmb { background: #00A651; color: #fff; }
    .eta-route-num.plate-mtrbus { background: #0077C8; color: #fff; }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
    .eta-stop-text { font-size: 0.9rem; margin-top: 8px; }
    .eta-co-badge {
      display: inline-block;
      background: #3a3a3c;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      margin-top: 6px;
    }
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .eta-mins.soon { color: var(--amber); }
    .eta-mins.arrived { color: var(--red); }
    .eta-clock {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: right;
    }
    .eta-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .eta-btn:active { background: #e5e5ea; }
    .eta-btn.active-refresh {
      background: var(--primary);
      color: white;
    }
    .eta-refresh-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 16px 10px;
      background: white;
    }

    /* Favorites & History */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
    }
    .section-title .clear-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 4px;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      color: #c7c7cc;
      transition: color 0.15s, transform 0.1s;
    }
    .fav-btn.on { color: #ff9500; }
    .fav-btn:active { transform: scale(0.9); }
    .result-item .fav-btn { margin-left: auto; }
    .home-hint {
      text-align: center;
      padding: 28px 20px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .page-header .fav-btn {
      color: rgba(255,255,255,0.7);
      font-size: 1.3rem;
      margin-right: 4px;
    }
    .page-header .fav-btn.on { color: #ffd60a; }
  </style>
</head>
<body>
  <div class="app">

    <!-- ========== PAGE: SEARCH ========== -->
    <div class="page active" id="pageSearch">
      <div class="header">搜尋</div>
      <div class="search-box">
        <input type="text" class="search-input" id="routeInput" placeholder="輸入路線號碼" readonly inputmode="none">
      </div>
      <div class="results" id="results">
        <div class="empty-state">輸入路線號碼開始搜尋</div>
      </div>
      <div class="keypad" id="keypad">
        <div class="keypad-main">
          <div class="num-pad">
            <div class="key-row">
              <button class="key" data-k="1">1</button>
              <button class="key" data-k="2">2</button>
              <button class="key" data-k="3">3</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="4">4</button>
              <button class="key" data-k="5">5</button>
              <button class="key" data-k="6">6</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="7">7</button>
              <button class="key" data-k="8">8</button>
              <button class="key" data-k="9">9</button>
            </div>
            <div class="key-row">
              <button class="key key-func" data-k="clear">✕</button>
              <button class="key" data-k="0">0</button>
              <button class="key key-func" data-k="back">⌫</button>
            </div>
          </div>
          <div class="letter-pad" id="letterKeys">
            <div class="key-row"><button class="key key-letter" data-k="A">A</button><button class="key key-letter" data-k="B">B</button><button class="key key-letter" data-k="C">C</button><button class="key key-letter" data-k="D">D</button></div>
            <div class="key-row"><button class="key key-letter" data-k="E">E</button><button class="key key-letter" data-k="F">F</button><button class="key key-letter" data-k="H">H</button><button class="key key-letter" data-k="K">K</button></div>
            <div class="key-row"><button class="key key-letter" data-k="M">M</button><button class="key key-letter" data-k="N">N</button><button class="key key-letter" data-k="P">P</button><button class="key key-letter" data-k="R">R</button></div>
            <div class="key-row"><button class="key key-letter" data-k="S">S</button><button class="key key-letter" data-k="T">T</button><button class="key key-letter" data-k="W">W</button><button class="key key-letter" data-k="X">X</button></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== PAGE: STOPS ========== -->
    <div class="page" id="pageStops">
      <div class="page-header">
        <button class="back-btn" onclick="goSearch()">‹</button>
        <div class="page-title" id="stopsTitle">選擇車站</div>
        <button class="fav-btn" id="stopsFavBtn" onclick="toggleFavFromStops()" title="收藏此路線">☆</button>
      </div>
      <div class="stop-list" id="stopList">
        <div class="loading-state">載入車站中...</div>
      </div>
    </div>

    <!-- ========== PAGE: ETA ========== -->
    <div class="page" id="pageEta">
      <div class="page-header">
        <button class="back-btn" onclick="goStops()">‹</button>
        <div class="page-title">預計到站</div>
        <button class="fav-btn" id="etaFavBtn" onclick="toggleFavFromEta()" title="收藏此路線">☆</button>
      </div>
      <div class="eta-area" id="etaArea">
        <div class="eta-header-info">
          <div class="eta-route-num" id="etaRoute">—</div>
          <div class="eta-dest-text" id="etaDest">—</div>
          <div class="eta-stop-text" id="etaStopName">—</div>
          <div class="eta-co-badge" id="etaCo">—</div>
        </div>
        <div class="eta-rows" id="etaRows"></div>
        <div class="eta-refresh-info" id="etaInfo"></div>
      </div>
      <div class="eta-toolbar">
        <button class="eta-btn" onclick="fetchETA()">🔄 刷新</button>
        <button class="eta-btn" id="btnAuto" onclick="toggleAuto()">▶ 自動刷新</button>
      </div>
    </div>

  </div>

  <script>
    const CO_NAMES = {
      kmb: '九巴', lwb: '龍運', ctb: '城巴',
      nlb: '嶼巴（大嶼山巴士）', gmb: '專線小巴', mtrbus: '港鐵巴士'
    };

    function shortCo(co) { return CO_NAMES[co] || co || ''; }

    // 原生小巴資料集
    const GMB_ROUTE_INDEX = {"1":[{"r":"HKI","id":2006408,"c":"1","d":[{"s":1,"o":"山頂(公共交通總站)","t":"中環(香港站公共運輸交匯處)"},{"s":2,"o":"中環(香港站公共運輸交匯處)","t":"山頂(公共交通總站)"}]},{"r":"NT","id":2002337,"c":"1","d":[{"s":1,"o":"西貢","t":"九龍灣(德福花園)"},{"s":2,"o":"九龍灣(德福花園)","t":"西貢"}]}],"10":[{"r":"HKI","id":2006706,"c":"10","d":[{"s":1,"o":"銅鑼灣(謝斐道)","t":"數碼港公共運輸交匯處"},{"s":2,"o":"數碼港巴士總站","t":"謝斐道, 近兆安廣場"}]}],"12":[{"r":"HKI","id":2002285,"c":"12","d":[{"s":1,"o":"觀龍樓","t":"西營盤(循環線)"}]},{"r":"KLN","id":2002329,"c":"12","d":[{"s":1,"o":"白田","t":"旺角東站"},{"s":2,"o":"旺角東站","t":"白田"}]}],"16":[{"r":"KLN","id":2004629,"c":"16","d":[{"s":1,"o":"扎山道(彩雲邨)","t":"坪石邨(循環線)"}]},{"r":"NT","id":2006641,"c":"16","d":[{"s":1,"o":"寶琳","t":"布袋澳"},{"s":2,"o":"布袋澳","t":"寶琳"}]}]};

    // 快取索引 Map 化以加速搜尋
    const gmbMap = new Map();
    Object.keys(GMB_ROUTE_INDEX).forEach(key => {
      gmbMap.set(key.toUpperCase(), GMB_ROUTE_INDEX[key]);
    });

    const LS_FAV = 'hkbus_fav_v1';
    const LS_HIST = 'hkbus_hist_v1';
    const HIST_MAX = 20;
    const FAV_MAX = 30;

    let favsCache = loadJSON(LS_FAV, []);
    let histCache = loadJSON(LS_HIST, []);
    let favMap = new Map(favsCache.map(item => [item.key, item]));

    function loadJSON(key, fallback) {
      try {
        const s = localStorage.getItem(key);
        return s ? JSON.parse(s) : fallback;
      } catch { return fallback; }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    function routeKey(m, route) {
      return [
        (route || m.route || '').toUpperCase(),
        m.co || '', m.bound || '', m.serviceType || '1',
        m.nlbRouteId || '', m.gmbRouteId || '', m.gmbRouteSeq || '',
        m.mtrDir || '', m.dirPath || ''
      ].join('|');
    }

    function snapshotRoute(m, route) {
      return {
        key: routeKey(m, route),
        route: (route || m.route || '').toUpperCase(),
        co: m.co, bound: m.bound, serviceType: m.serviceType || '1',
        label: m.label || '', sub: m.sub || '', dest: m.dest || '',
        nlbRouteId: m.nlbRouteId || null, gmbRouteId: m.gmbRouteId || null,
        gmbRouteSeq: m.gmbRouteSeq || null, dirPath: m.dirPath || null,
        mtrDir: m.mtrDir || '', at: Date.now()
      };
    }

    function isFav(m, route) {
      return favMap.has(routeKey(m, route));
    }

    function toggleFav(m, route) {
      const k = routeKey(m, route);
      if (favMap.has(k)) {
        favMap.delete(k);
      } else {
        if (favMap.size >= FAV_MAX) {
          const firstKey = favMap.keys().next().value;
          favMap.delete(firstKey);
        }
        favMap.set(k, snapshotRoute(m, route));
      }
      favsCache = Array.from(favMap.values());
      saveJSON(LS_FAV, favsCache);
      return favMap.has(k);
    }

    function addHistory(m, route) {
      const snap = snapshotRoute(m, route);
      histCache = histCache.filter(h => h.key !== snap.key);
      histCache.unshift(snap);
      if (histCache.length > HIST_MAX) histCache = histCache.slice(0, HIST_MAX);
      saveJSON(LS_HIST, histCache);
    }

    function clearHistory() {
      histCache = [];
      saveJSON(LS_HIST, []);
      if (!inputVal) renderHome();
    }

    function clearFavs() {
      if (!confirm('確定清除全部收藏？')) return;
      favMap.clear();
      favsCache = [];
      saveJSON(LS_FAV, []);
      if (!inputVal) renderHome();
      updateHeaderFavBtns();
    }

    // ========== DOM & 高效能渲染 ==========
    const resultsEl = document.getElementById('results');
    const routeInputEl = document.getElementById('routeInput');
    let inputVal = '';
    let searchDebounceTimer = null;
    let abortController = null;

    let state = {
      co: null, route: null, bound: null, serviceType: null,
      directionLabel: null, stopId: null, stopName: null,
      nlbRouteId: null, gmbRouteId: null, gmbRouteSeq: null,
      dirPath: null, mtrRawStop: null, mtrDir: null,
      auto: false, timer: null
    };

    function renderSavedItem(item, fragment) {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.dataset.itemData = JSON.stringify(item);
      const plate = 'plate-' + (item.co || 'kmb');
      const destText = (item.label || '').replace(/^.*?→\s*/, '') || item.dest || item.route;
      const coTag = (item.co === 'nlb' || item.co === 'ctb' || item.co === 'gmb' || item.co === 'mtrbus')
        ? ' - ' + shortCo(item.co) : '';
      const starOn = isFav(item, item.route);

      div.innerHTML = `
        <div class="result-num ${plate}">${item.route}</div>
        <div class="result-info">
          <div class="result-dest">往 ${destText}${coTag}</div>
          <div class="result-co">${CO_NAMES[item.co] || item.co || ''}${item.sub ? ' · ' + item.sub : ''}</div>
        </div>
        <button class="fav-btn ${starOn ? 'on' : ''}" data-fav="1">${starOn ? '★' : '☆'}</button>
        <div class="result-arrow">›</div>`;
      fragment.appendChild(div);
    }

    function renderHome() {
      resultsEl.innerHTML = '';
      if (!favsCache.length && !histCache.length) {
        resultsEl.innerHTML = '<div class="home-hint">輸入路線號碼開始搜尋<br><small style="opacity:.7">選過的路線會出現在這裡</small></div>';
        return;
      }
      const fragment = document.createDocumentFragment();

      if (favsCache.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>★ 收藏</span><button class="clear-link" type="button" onclick="clearFavs()">清除</button>';
        fragment.appendChild(t);
        favsCache.forEach(item => renderSavedItem(item, fragment));
      }
      if (histCache.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>最近搜尋</span><button class="clear-link" type="button" onclick="clearHistory()">清除</button>';
        fragment.appendChild(t);
        histCache.forEach(item => renderSavedItem(item, fragment));
      }
      resultsEl.appendChild(fragment);
    }

    // 事件委派：點擊搜尋結果
    resultsEl.addEventListener('click', (e) => {
      const itemEl = e.target.closest('.result-item');
      if (!itemEl) return;
      
      const item = JSON.parse(itemEl.dataset.itemData);
      if (e.target.closest('[data-fav]')) {
        e.stopPropagation();
        toggleFav(item, item.route);
        if (!inputVal) {
          renderHome();
        } else {
          const btn = itemEl.querySelector('[data-fav]');
          const on = isFav(item, item.route);
          btn.textContent = on ? '★' : '☆';
          btn.classList.toggle('on', on);
        }
        return;
      }
      selectRoute(item, item.route);
    });

    // 鍵盤輸入事件委派
    document.getElementById('keypad').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-k]');
      if (!btn) return;
      const k = btn.dataset.k;
      if (k === 'clear') inputVal = '';
      else if (k === 'back') inputVal = inputVal.slice(0, -1);
      else if (inputVal.length < 8) inputVal += k;

      routeInputEl.value = inputVal;
      
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(onSearchInput, 100);
    });

    function onSearchInput() {
      if (!inputVal) {
        renderHome();
        return;
      }
      resultsEl.innerHTML = '<div class="loading-state">搜尋中...</div>';
      
      // 中斷上一次尚未完成的請求
      if (abortController) abortController.abort();
      abortController = new AbortController();

      const query = inputVal.toUpperCase();
      const fragment = document.createDocumentFragment();

      // 優化 1：迅速從 Map 取出小巴本地數據
      if (gmbMap.has(query)) {
        gmbMap.get(query).forEach(g => {
          g.d.forEach(dir => {
            renderSavedItem({
              route: query, co: 'gmb', bound: dir.s, serviceType: '1',
              label: `${dir.o} → ${dir.t}`, dest: dir.t, gmbRouteId: g.id, gmbRouteSeq: dir.s
            }, fragment);
          });
        });
      }

      if (fragment.children.length > 0) {
        resultsEl.innerHTML = '';
        resultsEl.appendChild(fragment);
      } else {
        resultsEl.innerHTML = '<div class="empty-state">未有找到相關路線</div>';
      }
    }

    function selectRoute(item, route) {
      addHistory(item, route);
      state.route = route;
      state.co = item.co;
      state.bound = item.bound;
      state.directionLabel = item.label || item.dest;
      state.gmbRouteId = item.gmbRouteId;
      state.gmbRouteSeq = item.gmbRouteSeq;
      
      document.getElementById('stopsTitle').textContent = `${route} - ${state.directionLabel}`;
      document.getElementById('pageSearch').classList.remove('active');
      document.getElementById('pageStops').classList.add('active');
      updateHeaderFavBtns();
    }

    function goSearch() {
      document.getElementById('pageStops').classList.remove('active');
      document.getElementById('pageSearch').classList.add('active');
      if (!inputVal) renderHome();
    }

    function goStops() {
      document.getElementById('pageEta').classList.remove('active');
      document.getElementById('pageStops').classList.add('active');
    }

    function favItemFromState() {
      return {
        route: state.route, co: state.co, bound: state.bound,
        serviceType: state.serviceType || '1', label: state.directionLabel || '',
        dest: state.directionLabel || '', nlbRouteId: state.nlbRouteId,
        gmbRouteId: state.gmbRouteId, gmbRouteSeq: state.gmbRouteSeq
      };
    }

    function updateHeaderFavBtns() {
      if (!state.route || !state.co) return;
      const m = favItemFromState();
      const on = isFav(m, state.route);
      ['stopsFavBtn', 'etaFavBtn'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.textContent = on ? '★' : '☆';
          btn.classList.toggle('on', on);
        }
      });
    }

    function toggleFavFromStops() {
      if (!state.route) return;
      toggleFav(favItemFromState(), state.route);
      updateHeaderFavBtns();
    }
    function toggleFavFromEta() { toggleFavFromStops(); }

    // 初始化頁面
    renderHome();
  </script>
</body>
</html>
