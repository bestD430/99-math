<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港巴士到站時間</title>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }

    /* Search input area */
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }

    /* Results list */
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    
    .result-num {
      font-size: 1.5rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 6px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    
    .plate-kmb { background: #E4002B; color: #fff; }
    .plate-lwb { background: #F15A22; color: #fff; }
    .plate-ctb { background: #FFD100; color: #1a1a1a; }
    .plate-nlb { background: #007A3D; color: #fff; }
    .plate-gmb { background: #00A651; color: #fff; }
    .plate-mtrbus { background: #0077C8; color: #fff; }
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .error-state {
      text-align: center;
      padding: 24px 20px;
      color: var(--red);
      font-size: 0.9rem;
    }

    /* Keypad */
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 10px;
      user-select: none;
    }
    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      flex: 1;
      max-width: 48px;
      height: 40px;
      border-radius: 6px;
      font-size: 1rem;
      background: #d8dce0;
      color: #1c1c1e;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Weather Bar */
    .weather-bar {
      flex-shrink: 0;
      background: #1c232a;
      color: #f2f2f7;
      padding: 8px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.82rem;
    }
    .weather-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .weather-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .weather-temp {
      font-size: 1.05rem;
      font-weight: 700;
      color: #5ac8fa;
      white-space: nowrap;
    }
    .weather-desc {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d1d1d6;
    }
    .weather-warnings {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
    }
    .warn-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      display: inline-block;
      line-height: 1.2;
    }
    .warn-typhoon { background: #ff3b30; }
    .warn-rain { background: #5856d6; }
    .warn-amber { background: #ff9500; }
    .warn-red { background: #ff2d55; }
    .warn-black { background: #000000; border: 1px solid #555; }
    .warn-normal { background: #34c759; }

    /* Sub pages */
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }

    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }
    .stop-arrow { color: #c7c7cc; }

    /* ETA board */
    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    
    .eta-route-num {
      font-size: 2.1rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .eta-route-num.plate-kmb { background: #E4002B; color: #fff; }
    .eta-route-num.plate-lwb { background: #F15A22; color: #fff; }
    .eta-route-num.plate-ctb { background: #FFD100; color: #1a1a1a; }
    .eta-route-num.plate-nlb { background: #007A3D; color: #fff; }
    .eta-route-num.plate-gmb { background: #00A651; color: #fff; }
    .eta-route-num.plate-mtrbus { background: #0077C8; color: #fff; }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
    .eta-stop-text { font-size: 0.9rem; margin-top: 8px; }
    .eta-co-badge {
      display: inline-block;
      background: #3a3a3c;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      margin-top: 6px;
    }
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .eta-mins.soon { color: var(--amber); }
    .eta-mins.arrived { color: var(--red); }
    .eta-clock {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: right;
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .eta-btn:active { background: #e5e5ea; }
    .eta-refresh-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 16px 10px;
      background: white;
    }

    /* Favorites & History */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
    }
    .section-title .clear-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 4px;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      color: #c7c7cc;
      transition: color 0.15s, transform 0.1s;
    }
    .fav-btn.on { color: #ff9500; }
    .fav-btn:active { transform: scale(0.9); }
    .result-item .fav-btn { margin-left: auto; }
    .home-hint {
      text-align: center;
      padding: 28px 20px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .page-header .fav-btn {
      color: rgba(255,255,255,0.7);
      font-size: 1.3rem;
      margin-right: 4px;
    }
    .page-header .fav-btn.on { color: #ffd60a; }
  </style>
</head>
<body>
  <div class="app">

    <!-- ========== PAGE: SEARCH ========== -->
    <div class="page active" id="pageSearch">
      <div class="header">搜尋路線</div>
      <div class="search-box">
        <input type="text" class="search-input" id="routeInput" placeholder="輸入路線號碼 (例如 1A, E22)" readonly inputmode="none">
      </div>
      <div class="results" id="results">
        <div class="empty-state">輸入路線號碼開始搜尋</div>
      </div>
      <div class="keypad" id="keypad">
        <div class="keypad-main">
          <div class="num-pad">
            <div class="key-row">
              <button class="key" data-k="1">1</button>
              <button class="key" data-k="2">2</button>
              <button class="key" data-k="3">3</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="4">4</button>
              <button class="key" data-k="5">5</button>
              <button class="key" data-k="6">6</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="7">7</button>
              <button class="key" data-k="8">8</button>
              <button class="key" data-k="9">9</button>
            </div>
            <div class="key-row">
              <button class="key key-func" data-k="clear">✕</button>
              <button class="key" data-k="0">0</button>
              <button class="key key-func" data-k="back">⌫</button>
            </div>
          </div>
          <div class="letter-pad" id="letterKeys"></div>
        </div>
      </div>

      <!-- 天氣與警告資訊 -->
      <div class="weather-bar" id="weatherBar">
        <div class="weather-bar-inner">
          <div class="weather-info">
            <span class="weather-temp" id="weatherTemp">--°C</span>
            <span class="weather-desc" id="weatherDesc">載入天氣中...</span>
          </div>
          <div class="weather-warnings" id="weatherWarnings">
            <span class="warn-badge warn-normal">無警告</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== PAGE: STOPS ========== -->
    <div class="page" id="pageStops">
      <div class="page-header">
        <button class="back-btn" onclick="goSearch()">‹</button>
        <div class="page-title" id="stopsTitle">選擇車站</div>
        <button class="fav-btn" id="stopsFavBtn" onclick="toggleFavFromStops()" title="收藏此路線">☆</button>
      </div>
      <div class="stop-list" id="stopList">
        <div class="loading-state">載入車站中...</div>
      </div>
    </div>

    <!-- ========== PAGE: ETA ========== -->
    <div class="page" id="pageEta">
      <div class="page-header">
        <button class="back-btn" onclick="goStops()">‹</button>
        <div class="page-title">預計到站時間</div>
        <button class="fav-btn" id="etaFavBtn" onclick="toggleFavFromEta()" title="收藏此路線">☆</button>
      </div>
      <div class="eta-area" id="etaArea">
        <div class="eta-header-info">
          <div class="eta-route-num" id="etaRoute">—</div>
          <div class="eta-dest-text" id="etaDest">—</div>
          <div class="eta-stop-text" id="etaStopName">—</div>
          <div class="eta-co-badge" id="etaCo">—</div>
        </div>
        <div class="eta-rows" id="etaRows"></div>
        <div class="eta-refresh-info" id="etaInfo"></div>
      </div>
      <div class="eta-toolbar">
        <button class="eta-btn" onclick="fetchETA()">🔄 刷新</button>
        <button class="eta-btn" id="btnAuto" onclick="toggleAuto()">▶ 自動刷新</button>
      </div>
    </div>

  </div>

  <script>
    const LETTERS = ['A','B','C','D','E','F','H','K','M','N','P','R','S','T','W','X'];
    const CO_NAMES = {
      kmb: '九巴',
      lwb: '龍運巴士',
      ctb: '城巴',
      nlb: '新大嶼山巴士',
      gmb: '綠色專線小巴',
      mtrbus: '港鐵巴士'
    };

    function isLWB(route) {
      const r = String(route).toUpperCase();
      if (/^A[3-5]\d/.test(r)) return true;
      if (/^E[3-4]\d/.test(r)) return true;
      if (/^S(1|64)/.test(r)) return true;
      if (/^R(8|33|42)/.test(r)) return true;
      if (/^N(30|31|36|39|42|64)/.test(r)) return true;
      return false;
    }

    // 初始化字母鍵盤
    const letterBox = document.getElementById('letterKeys');
    if (letterBox) {
      for (let i = 0; i < LETTERS.length; i += 4) {
        const row = document.createElement('div');
        row.className = 'key-row';
        LETTERS.slice(i, i + 4).forEach(L => {
          const b = document.createElement('button');
          b.className = 'key key-letter';
          b.dataset.k = L;
          b.textContent = L;
          row.appendChild(b);
        });
        letterBox.appendChild(row);
      }
    }

    // ========== 香港天文台 API 獲取天氣與警告 ==========
    async function fetchWeather() {
      try {
        const [reportRes, warningRes] = await Promise.all([
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc')
        ]);
        
        const reportData = await reportRes.json();
        const warningData = await warningRes.json();

        if (reportData.temperature && reportData.temperature.data && reportData.temperature.data.length > 0) {
          const hkTemp = reportData.temperature.data.find(t => t.place === '香港天文台') || reportData.temperature.data[0];
          document.getElementById('weatherTemp').textContent = `${hkTemp.value}°C`;
        }

        let weatherText = '多雲';
        if (reportData.rainfall && reportData.rainfall.data) {
          const mainRain = reportData.rainfall.data.find(r => r.main === 'max') || reportData.rainfall.data[0];
          if (mainRain && mainRain.max > 0) {
            weatherText = `雨量 ${mainRain.max}mm`;
          }
        }
        document.getElementById('weatherDesc').textContent = weatherText;

        const warningsContainer = document.getElementById('weatherWarnings');
        warningsContainer.innerHTML = '';
        let hasWarning = false;

        if (warningData) {
          for (const key in warningData) {
            const warn = warningData[key];
            if (!warn || !warn.actionCode || warn.actionCode === 'CANCELLED') continue;

            hasWarning = true;
            const badge = document.createElement('span');
            badge.className = 'warn-badge ';
            
            const code = warn.code || key;
            const name = warn.name || '警告';

            if (code.includes('TC') || name.includes('颱風') || name.includes('風球')) {
              badge.classList.add('warn-typhoon');
            } else if (code.includes('RAIN') || name.includes('暴雨')) {
              if (name.includes('黃')) badge.classList.add('warn-amber');
              else if (name.includes('紅')) badge.classList.add('warn-red');
              else if (name.includes('黑')) badge.classList.add('warn-black');
              else badge.classList.add('warn-rain');
            } else {
              badge.classList.add('warn-amber');
            }

            badge.textContent = name;
            warningsContainer.appendChild(badge);
          }
        }

        if (!hasWarning) {
          warningsContainer.innerHTML = '<span class="warn-badge warn-normal">無警告</span>';
        }

      } catch (err) {
        console.error('Weather error:', err);
        document.getElementById('weatherDesc').textContent = '天氣暫未能載入';
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 5 * 60 * 1000);

    // ========== 收藏 & 歷史紀錄 ==========
    const LS_FAV = 'hkbus_fav_v1';
    const LS_HIST = 'hkbus_hist_v1';
    const HIST_MAX = 20;
    const FAV_MAX = 30;

    function loadJSON(key, fallback) {
      try {
        const s = localStorage.getItem(key);
        if (!s) return fallback;
        const v = JSON.parse(s);
        return Array.isArray(v) ? v : fallback;
      } catch { return fallback; }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    function routeKey(m, route) {
      return [
        (route || m.route || '').toUpperCase(),
        m.co || '',
        m.bound || '',
        m.serviceType || '1',
        m.nlbRouteId || '',
        m.gmbRouteId || '',
        m.gmbRouteSeq || '',
        m.mtrDir || ''
      ].join('|');
    }

    function snapshotRoute(m, route) {
      return {
        key: routeKey(m, route),
        route: (route || m.route || '').toUpperCase(),
        co: m.co,
        bound: m.bound,
        serviceType: m.serviceType || '1',
        label: m.label || '',
        sub: m.sub || '',
        dest: m.dest || '',
        nlbRouteId: m.nlbRouteId || null,
        gmbRouteId: m.gmbRouteId || null,
        gmbRouteSeq: m.gmbRouteSeq || null,
        mtrDir: m.mtrDir || '',
        at: Date.now()
      };
    }

    function getFavs() { return loadJSON(LS_FAV, []); }
    function getHist() { return loadJSON(LS_HIST, []); }

    function isFav(m, route) {
      const k = routeKey(m, route);
      return getFavs().some(f => f.key === k);
    }

    function toggleFav(m, route) {
      let list = getFavs();
      const k = routeKey(m, route);
      const idx = list.findIndex(f => f.key === k);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.unshift(snapshotRoute(m, route));
        if (list.length > FAV_MAX) list = list.slice(0, FAV_MAX);
      }
      saveJSON(LS_FAV, list);
      return idx < 0;
    }

    function addHistory(m, route) {
      let list = getHist();
      const snap = snapshotRoute(m, route);
      list = list.filter(h => h.key !== snap.key);
      list.unshift(snap);
      if (list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
      saveJSON(LS_HIST, list);
    }

    function clearHistory() {
      saveJSON(LS_HIST, []);
      if (!inputVal) renderHome();
    }

    function clearFavs() {
      if (!confirm('確定清除全部收藏？')) return;
      saveJSON(LS_FAV, []);
      if (!inputVal) renderHome();
      updateHeaderFavBtns();
    }

    function favItemFromState() {
      return {
        route: state.route,
        co: state.co,
        bound: state.bound,
        serviceType: state.serviceType || '1',
        label: state.directionLabel || '',
        dest: state.directionLabel || '',
        nlbRouteId: state.nlbRouteId,
        gmbRouteId: state.gmbRouteId,
        gmbRouteSeq: state.gmbRouteSeq,
        mtrDir: state.mtrDir || ''
      };
    }

    function updateHeaderFavBtns() {
      if (!state.route || !state.co) return;
      const m = favItemFromState();
      const on = isFav(m, state.route);
      ['stopsFavBtn', 'etaFavBtn'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.textContent = on ? '★' : '☆';
        btn.classList.toggle('on', on);
      });
    }

    function toggleFavFromStops() {
      if (!state.route) return;
      toggleFav(favItemFromState(), state.route);
      updateHeaderFavBtns();
    }
    function toggleFavFromEta() { toggleFavFromStops(); }

    function renderSavedItem(item, el, showStar) {
      const div = document.createElement('div');
      div.className = 'result-item';
      const plate = 'plate-' + (item.co || 'kmb');
      const destText = (item.label || '').replace(/^.*?→\s*/, '') || item.dest || item.route;
      const starOn = isFav(item, item.route);
      
      div.innerHTML =
        '<div class="result-num ' + plate + '">' + item.route + '</div>' +
        '<div class="result-info">' +
          '<div class="result-dest">往 ' + destText + '</div>' +
          '<div class="result-co">' + (CO_NAMES[item.co] || item.co || '') + '</div>' +
        '</div>' +
        (showStar
          ? '<button class="fav-btn' + (starOn ? ' on' : '') + '" data-fav="1">' + (starOn ? '★' : '☆') + '</button>'
          : '') +
        '<div class="result-arrow">›</div>';

      div.addEventListener('click', e => {
        if (e.target.closest('[data-fav]')) {
          e.stopPropagation();
          toggleFav(item, item.route);
          if (!inputVal) renderHome();
          else {
            const btn = div.querySelector('[data-fav]');
            if (btn) {
              const on = isFav(item, item.route);
              btn.textContent = on ? '★' : '☆';
              btn.classList.toggle('on', on);
            }
          }
          return;
        }
        selectRoute(item, item.route);
      });
      el.appendChild(div);
    }

    function renderHome() {
      const el = document.getElementById('results');
      const favs = getFavs();
      const hist = getHist();
      el.innerHTML = '';
      if (!favs.length && !hist.length) {
        el.innerHTML = '<div class="home-hint">輸入路線號碼開始搜尋<br><small style="opacity:.7">搜尋紀錄與收藏將會自動出現在此</small></div>';
        return;
      }
      if (favs.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>★ 收藏路線</span><button class="clear-link" type="button">清除</button>';
        t.querySelector('.clear-link').onclick = clearFavs;
        el.appendChild(t);
        favs.forEach(item => renderSavedItem(item, el, true));
      }
      if (hist.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>最近搜尋</span><button class="clear-link" type="button">清除</button>';
        t.querySelector('.clear-link').onclick = clearHistory;
        el.appendChild(t);
        hist.forEach(item => renderSavedItem(item, el, true));
      }
    }

    let inputVal = '';
    let searchTimer = null;
    let state = {
      co: null, route: null, bound: null, serviceType: null,
      directionLabel: null, stopId: null, stopName: null,
      nlbRouteId: null, gmbRouteId: null, gmbRouteSeq: null,
      mtrDir: null, auto: false, timer: null
    };

    let cache = { kmbRoutes: null, kmbAt: 0, nlbRoutes: null, nlbAt: 0 };
    const TTL = 30 * 60 * 1000;

    // 鍵盤點擊處理
    document.getElementById('keypad').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const k = btn.dataset.k;
      if (!k) return;

      if (k === 'clear') inputVal = '';
      else if (k === 'back') inputVal = inputVal.slice(0, -1);
      else if (inputVal.length < 6) inputVal += k;
      
      document.getElementById('routeInput').value = inputVal;
      
      if (searchTimer) clearTimeout(searchTimer);
      if (!inputVal) {
        renderHome();
      } else {
        searchTimer = setTimeout(() => onSearchInput(inputVal), 250);
      }
    });

    // ========== 路線 API 搜尋邏輯 ==========
    async function fetchKmbRoutes() {
      if (cache.kmbRoutes && (Date.now() - cache.kmbAt < TTL)) return cache.kmbRoutes;
      const res = await fetch('https://data.etabus.gov.hk/v1/carpark/kmb/route'); // Fallback API URL format check
      const data = await res.json();
      cache.kmbRoutes = data.data || [];
      cache.kmbAt = Date.now();
      return cache.kmbRoutes;
    }

    async function fetchNlbRoutes() {
      if (cache.nlbRoutes && (Date.now() - cache.nlbAt < TTL)) return cache.nlbRoutes;
      const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list');
      const data = await res.json();
      cache.nlbRoutes = data.routes || [];
      cache.nlbAt = Date.now();
      return cache.nlbRoutes;
    }

    async function onSearchInput(query) {
      query = query.trim().toUpperCase();
      const resultsEl = document.getElementById('results');
      if (!query) { renderHome(); return; }

      resultsEl.innerHTML = '<div class="loading-state">搜尋路線中...</div>';
      const results = [];

      try {
        // 1. 九巴 / 龍運 (KMB / LWB API)
        const kmbRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route`);
        if (kmbRes.ok) {
          const kmbData = await kmbRes.json();
          const matches = (kmbData.data || []).filter(r => r.route.toUpperCase() === query);
          matches.forEach(r => {
            const co = isLWB(r.route) ? 'lwb' : 'kmb';
            results.push({
              co: co,
              route: r.route,
              bound: r.bound === 'O' ? 'outbound' : 'inbound',
              serviceType: r.service_type,
              label: `${r.orig_tc} → ${r.dest_tc}`,
              dest: r.dest_tc
            });
          });
        }

        // 2. 城巴 (Citybus API)
        const ctbRes = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/route/ctb/${query}`);
        if (ctbRes.ok) {
          const ctbData = await ctbRes.json();
          if (ctbData.data) {
            results.push({
              co: 'ctb',
              route: ctbData.data.route,
              bound: 'outbound',
              label: `${ctbData.data.orig_tc} → ${ctbData.data.dest_tc}`,
              dest: ctbData.data.dest_tc
            });
            results.push({
              co: 'ctb',
              route: ctbData.data.route,
              bound: 'inbound',
              label: `${ctbData.data.dest_tc} → ${ctbData.data.orig_tc}`,
              dest: ctbData.data.orig_tc
            });
          }
        }

        // 3. 新大嶼山巴士 (NLB)
        const nlbList = await fetchNlbRoutes();
        const nlbMatches = nlbList.filter(r => r.routeName.toUpperCase() === query);
        nlbMatches.forEach(r => {
          results.push({
            co: 'nlb',
            route: r.routeName,
            nlbRouteId: r.routeId,
            label: `${r.routeName_tc}`,
            dest: r.routeName_tc.split('>')?.[1]?.trim() || r.routeName_tc
          });
        });

        // 4. 專線小巴 (GMB API)
        const gmbRes = await fetch(`https://data.etagmb.gov.hk/route/search?q=${query}`);
        if (gmbRes.ok) {
          const gmbData = await gmbRes.json();
          if (gmbData.data && gmbData.data.length > 0) {
            gmbData.data.forEach(r => {
              if (r.code.toUpperCase() === query) {
                (r.directions || []).forEach(d => {
                  results.push({
                    co: 'gmb',
                    route: r.code,
                    gmbRouteId: r.route_id,
                    gmbRouteSeq: d.route_seq,
                    label: `${d.orig_tc} → ${d.dest_tc}`,
                    dest: d.dest_tc
                  });
                });
              }
            });
          }
        }

      } catch (err) {
        console.error('Search error:', err);
      }

      // 渲染搜尋結果
      resultsEl.innerHTML = '';
      if (results.length === 0) {
        resultsEl.innerHTML = `<div class="empty-state">找不到路線「${query}」</div>`;
      } else {
        results.forEach(item => renderSavedItem(item, resultsEl, true));
      }
    }

    // ========== 選擇路線並載入車站清單 ==========
    async function selectRoute(item, route) {
      state.co = item.co;
      state.route = route;
      state.bound = item.bound;
      state.serviceType = item.serviceType || '1';
      state.directionLabel = item.label;
      state.nlbRouteId = item.nlbRouteId;
      state.gmbRouteId = item.gmbRouteId;
      state.gmbRouteSeq = item.gmbRouteSeq;

      addHistory(item, route);
      document.getElementById('stopsTitle').textContent = `${route} (${CO_NAMES[item.co] || ''})`;
      updateHeaderFavBtns();
      goStops();

      const listEl = document.getElementById('stopList');
      listEl.innerHTML = '<div class="loading-state">載入車站清單中...</div>';

      try {
        let stops = [];

        if (item.co === 'kmb' || item.co === 'lwb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${item.bound}/${item.serviceType}`);
          const data = await res.json();
          const rawStops = data.data || [];

          for (const s of rawStops) {
            const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`);
            const stopData = await stopRes.json();
            stops.push({
              seq: s.seq,
              stopId: s.stop,
              name: stopData.data ? stopData.data.name_tc : `車站 ${s.stop}`
            });
          }
        } else if (item.co === 'ctb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb/${route}/${item.bound}`);
          const data = await res.json();
          const rawStops = data.data || [];

          for (const s of rawStops) {
            const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/stop/${s.stop}`);
            const stopData = await stopRes.json();
            stops.push({
              seq: s.seq,
              stopId: s.stop,
              name: stopData.data ? stopData.data.name_tc : `車站 ${s.stop}`
            });
          }
        } else if (item.co === 'nlb') {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${item.nlbRouteId}`);
          const data = await res.json();
          stops = (data.stops || []).map((s, idx) => ({
            seq: idx + 1,
            stopId: s.stopId,
            name: s.stopName_tc
          }));
        } else if (item.co === 'gmb') {
          const res = await fetch(`https://data.etagmb.gov.hk/route-stop/${item.gmbRouteId}/${item.gmbRouteSeq}`);
          const data = await res.json();
          stops = (data.data?.stops || []).map((s, idx) => ({
            seq: idx + 1,
            stopId: s.stop_id,
            name: s.name_tc
          }));
        }

        listEl.innerHTML = '';
        if (stops.length === 0) {
          listEl.innerHTML = '<div class="empty-state">暫無車站資料</div>';
          return;
        }

        stops.forEach(s => {
          const div = document.createElement('div');
          div.className = 'stop-item';
          div.innerHTML = `
            <div class="stop-seq">${s.seq}</div>
            <div class="stop-name">${s.name}</div>
            <div class="stop-arrow">›</div>
          `;
          div.onclick = () => selectStop(s);
          listEl.appendChild(div);
        });

      } catch (err) {
        console.error('Stop list error:', err);
        listEl.innerHTML = '<div class="error-state">載入車站時發生錯誤，請稍後重試</div>';
      }
    }

    // ========== 選擇車站並獲取 ETA ==========
    function selectStop(stop) {
      state.stopId = stop.stopId;
      state.stopName = stop.name;

      document.getElementById('etaRoute').textContent = state.route;
      document.getElementById('etaRoute').className = `eta-route-num plate-${state.co}`;
      document.getElementById('etaDest').textContent = `往 ${state.directionLabel || ''}`;
      document.getElementById('etaStopName').textContent = `📍 ${stop.name}`;
      document.getElementById('etaCo').textContent = CO_NAMES[state.co] || state.co;

      updateHeaderFavBtns();
      goEta();
      fetchETA();
    }

    async function fetchETA() {
      const rowsEl = document.getElementById('etaRows');
      const infoEl = document.getElementById('etaInfo');
      rowsEl.innerHTML = '<div class="loading-state">更新到站時間中...</div>';

      try {
        let etas = [];

        if (state.co === 'kmb' || state.co === 'lwb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${state.stopId}/${state.route}/${state.serviceType}`);
          const data = await res.json();
          etas = (data.data || []).filter(e => e.dir === (state.bound === 'outbound' ? 'O' : 'I')).map(e => ({
            time: e.eta,
            remark: e.rmk_tc
          }));
        } else if (state.co === 'ctb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${state.stopId}/${state.route}`);
          const data = await res.json();
          etas = (data.data || []).map(e => ({
            time: e.eta,
            remark: e.rmk_tc
          }));
        } else if (state.co === 'gmb') {
          const res = await fetch(`https://data.etagmb.gov.hk/eta/route-stop/${state.gmbRouteId}/${state.gmbRouteSeq}/${state.stopId}`);
          const data = await res.json();
          etas = (data.data?.etas || []).map(e => ({
            time: e.timestamp,
            remark: e.remarks_tc
          }));
        }

        rowsEl.innerHTML = '';
        const now = Date.now();

        if (etas.length === 0 || etas.every(e => !e.time)) {
          rowsEl.innerHTML = '<div class="eta-empty">未有即時班次資料</div>';
        } else {
          etas.forEach(e => {
            if (!e.time) return;
            const etaTime = new Date(e.time).getTime();
            const diffMins = Math.floor((etaTime - now) / 60000);

            let displayMin = `${diffMins} 分鐘`;
            let statusClass = '';

            if (diffMins <= 0) {
              displayMin = '即將到達 / 已到站';
              statusClass = 'arrived';
            } else if (diffMins <= 3) {
              statusClass = 'soon';
            }

            const div = document.createElement('div');
            div.className = 'eta-row';
            div.innerHTML = `
              <div class="eta-mins ${statusClass}">${displayMin}</div>
              <div class="eta-clock">${new Date(e.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} ${e.remark ? `<br><small>${e.remark}</small>` : ''}</div>
            `;
            rowsEl.appendChild(div);
          });
        }

        infoEl.textContent = `上次更新時間: ${new Date().toLocaleTimeString()}`;

      } catch (err) {
        console.error('ETA error:', err);
        rowsEl.innerHTML = '<div class="error-state">未能載入到站時間</div>';
      }
    }

    function toggleAuto() {
      state.auto = !state.auto;
      const btn = document.getElementById('btnAuto');
      if (state.auto) {
        btn.textContent = '⏸ 停止自動刷新';
        btn.style.background = '#34c759';
        btn.style.color = '#fff';
        state.timer = setInterval(fetchETA, 15000);
      } else {
        btn.textContent = '▶ 自動刷新';
        btn.style.background = '#f2f2f7';
        btn.style.color = 'inherit';
        if (state.timer) clearInterval(state.timer);
      }
    }

    function goSearch() {
      if (state.timer) clearInterval(state.timer);
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageSearch').classList.add('active');
    }
    function goStops() {
      if (state.timer) clearInterval(state.timer);
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageStops').classList.add('active');
    }
    function goEta() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageEta').classList.add('active');
    }

    // 頁面初始化
    renderHome();
  </script>
</body>
</html>
