<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港巴士到站時間</title>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }

    /* Search input area */
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }

    /* Results list */
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    
    .result-num {
      font-size: 1.725rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    
    .plate-kmb { background: #E4002B; color: #fff; }
    .plate-lwb { background: #F15A22; color: #fff; }
    .plate-ctb { background: #FFD100; color: #1a1a1a; }
    .plate-nlb { background: #007A3D; color: #fff; }
    .plate-gmb { background: #00A651; color: #fff; }
    .plate-mtrbus { background: #0077C8; color: #fff; }
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .error-state {
      text-align: center;
      padding: 24px 20px;
      color: var(--red);
      font-size: 0.9rem;
    }

    /* Keypad */
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 10px;
      user-select: none;
    }
    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      flex: 1;
      max-width: 48px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.05rem;
      background: #d8dce0;
      color: #1c1c1e;
      flex: 0 0 42px;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad .key-row {
      justify-content: center;
    }

    /* 天氣與警告 Widget (位於鍵盤下方) */
    .weather-bar {
      flex-shrink: 0;
      background: #1c232a;
      color: #f2f2f7;
      padding: 8px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.82rem;
    }
    .weather-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .weather-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .weather-temp {
      font-size: 1.05rem;
      font-weight: 700;
      color: #5ac8fa;
      white-space: nowrap;
    }
    .weather-desc {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d1d1d6;
    }
    .weather-warnings {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
    }
    .warn-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      display: inline-block;
      line-height: 1.2;
    }
    .warn-typhoon { background: #ff3b30; }
    .warn-rain { background: #5856d6; }
    .warn-amber { background: #ff9500; }
    .warn-red { background: #ff2d55; }
    .warn-black { background: #000000; border: 1px solid #555; }
    .warn-normal { background: #34c759; }

    /* Sub pages */
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }

    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-right: 36px;
    }

    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }
    .stop-arrow { color: #c7c7cc; }

    /* ETA board */
    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    
    .eta-route-num {
      font-size: 2.1rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .eta-route-num.plate-kmb { background: #E4002B; color: #fff; }
    .eta-route-num.plate-lwb { background: #F15A22; color: #fff; }
    .eta-route-num.plate-ctb { background: #FFD100; color: #1a1a1a; }
    .eta-route-num.plate-nlb { background: #007A3D; color: #fff; }
    .eta-route-num.plate-gmb { background: #00A651; color: #fff; }
    .eta-route-num.plate-mtrbus { background: #0077C8; color: #fff; }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
    .eta-stop-text { font-size: 0.9rem; margin-top: 8px; }
    .eta-co-badge {
      display: inline-block;
      background: #3a3a3c;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      margin-top: 6px;
    }
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .eta-mins.soon { color: var(--amber); }
    .eta-mins.arrived { color: var(--red); }
    .eta-clock {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: right;
    }
    .eta-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .eta-btn:active { background: #e5e5ea; }
    .eta-btn.active-refresh {
      background: var(--primary);
      color: white;
    }
    .eta-refresh-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 16px 10px;
      background: white;
    }

    /* Favorites & History */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
    }
    .section-title .clear-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 4px;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      color: #c7c7cc;
      transition: color 0.15s, transform 0.1s;
    }
    .fav-btn.on { color: #ff9500; }
    .fav-btn:active { transform: scale(0.9); }
    .result-item .fav-btn { margin-left: auto; }
    .home-hint {
      text-align: center;
      padding: 28px 20px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .page-header .fav-btn {
      color: rgba(255,255,255,0.7);
      font-size: 1.3rem;
      margin-right: 4px;
    }
    .page-header .fav-btn.on { color: #ffd60a; }
  </style>
</head>
<body>
  <div class="app">

    <!-- ========== PAGE: SEARCH ========== -->
    <div class="page active" id="pageSearch">
      <div class="header">搜尋</div>
      <div class="search-box">
        <input type="text" class="search-input" id="routeInput" placeholder="輸入路線號碼" readonly inputmode="none">
      </div>
      <div class="results" id="results">
        <div class="empty-state">輸入路線號碼開始搜尋</div>
      </div>
      <div class="keypad" id="keypad">
        <div class="keypad-main">
          <div class="num-pad">
            <div class="key-row">
              <button class="key" data-k="1">1</button>
              <button class="key" data-k="2">2</button>
              <button class="key" data-k="3">3</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="4">4</button>
              <button class="key" data-k="5">5</button>
              <button class="key" data-k="6">6</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="7">7</button>
              <button class="key" data-k="8">8</button>
              <button class="key" data-k="9">9</button>
            </div>
            <div class="key-row">
              <button class="key key-func" data-k="clear">✕</button>
              <button class="key" data-k="0">0</button>
              <button class="key key-func" data-k="back">⌫</button>
            </div>
          </div>
          <div class="letter-pad" id="letterKeys">
            <div class="key-row"><button class="key key-letter" data-k="A">A</button><button class="key key-letter" data-k="B">B</button><button class="key key-letter" data-k="C">C</button><button class="key key-letter" data-k="D">D</button></div>
            <div class="key-row"><button class="key key-letter" data-k="E">E</button><button class="key key-letter" data-k="F">F</button><button class="key key-letter" data-k="H">H</button><button class="key key-letter" data-k="K">K</button></div>
            <div class="key-row"><button class="key key-letter" data-k="M">M</button><button class="key key-letter" data-k="N">N</button><button class="key key-letter" data-k="P">P</button><button class="key key-letter" data-k="R">R</button></div>
            <div class="key-row"><button class="key key-letter" data-k="S">S</button><button class="key key-letter" data-k="T">T</button><button class="key key-letter" data-k="W">W</button><button class="key key-letter" data-k="X">X</button></div>
          </div>
        </div>
      </div>

      <!-- ========== 鍵盤下方天氣與警告資訊 ========== -->
      <div class="weather-bar" id="weatherBar">
        <div class="weather-bar-inner">
          <div class="weather-info">
            <span class="weather-temp" id="weatherTemp">--°C</span>
            <span class="weather-desc" id="weatherDesc">載入天氣中...</span>
          </div>
          <div class="weather-warnings" id="weatherWarnings">
            <span class="warn-badge warn-normal">無警告</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== PAGE: STOPS ========== -->
    <div class="page" id="pageStops">
      <div class="page-header">
        <button class="back-btn" onclick="goSearch()">‹</button>
        <div class="page-title" id="stopsTitle">選擇車站</div>
        <button class="fav-btn" id="stopsFavBtn" onclick="toggleFavFromStops()" title="收藏此路線">☆</button>
      </div>
      <div class="stop-list" id="stopList">
        <div class="loading-state">載入車站中...</div>
      </div>
    </div>

    <!-- ========== PAGE: ETA ========== -->
    <div class="page" id="pageEta">
      <div class="page-header">
        <button class="back-btn" onclick="goStops()">‹</button>
        <div class="page-title">預計到站</div>
        <button class="fav-btn" id="etaFavBtn" onclick="toggleFavFromEta()" title="收藏此路線">☆</button>
      </div>
      <div class="eta-area" id="etaArea">
        <div class="eta-header-info">
          <div class="eta-route-num" id="etaRoute">—</div>
          <div class="eta-dest-text" id="etaDest">—</div>
          <div class="eta-stop-text" id="etaStopName">—</div>
          <div class="eta-co-badge" id="etaCo">—</div>
        </div>
        <div class="eta-rows" id="etaRows"></div>
        <div class="eta-refresh-info" id="etaInfo"></div>
      </div>
      <div class="eta-toolbar">
        <button class="eta-btn" onclick="fetchETA()">🔄 刷新</button>
        <button class="eta-btn" id="btnAuto" onclick="toggleAuto()">▶ 自動刷新</button>
      </div>
    </div>

  </div>

  <script>
    const LETTERS = ['A','B','C','D','E','F','H','K','M','N','P','R','S','T','W','X'];
    const CO_NAMES = {
      kmb: '九巴',
      lwb: '龍運',
      ctb: '城巴',
      nlb: '嶼巴（大嶼山巴士）',
      gmb: '專線小巴',
      mtrbus: '港鐵巴士'
    };

    function isLWB(route) {
      const r = String(route).toUpperCase();
      if (/^A[3-5]\d/.test(r)) return true;
      if (/^E[3-4]\d/.test(r)) return true;
      if (/^S(1|64)/.test(r)) return true;
      if (/^R(8|33|42)/.test(r)) return true;
      if (/^N(30|31|36|39|42|64)/.test(r)) return true;
      return false;
    }

    const letterBox = document.getElementById('letterKeys');
    if (letterBox && !letterBox.children.length) {
      for (let i = 0; i < LETTERS.length; i += 4) {
        const row = document.createElement('div');
        row.className = 'key-row';
        LETTERS.slice(i, i + 4).forEach(L => {
          const b = document.createElement('button');
          b.className = 'key key-letter';
          b.dataset.k = L;
          b.textContent = L;
          row.appendChild(b);
        });
        letterBox.appendChild(row);
      }
    }

    // ========== 香港天文台 API 獲取天氣與警告 ==========
    async function fetchWeather() {
      try {
        const [reportRes, warningRes] = await Promise.all([
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc')
        ]);
        
        const reportData = await reportRes.json();
        const warningData = await warningRes.json();

        // 溫度與概述
        if (reportData.temperature && reportData.temperature.data && reportData.temperature.data.length > 0) {
          // 預設取天文台總部溫度
          const hkTemp = reportData.temperature.data.find(t => t.place === '香港天文台') || reportData.temperature.data[0];
          document.getElementById('weatherTemp').textContent = `${hkTemp.value}°C`;
        }

        let weatherText = '多雲';
        if (reportData.rainfall && reportData.rainfall.data) {
          const mainRain = reportData.rainfall.data.find(r => r.main === 'max') || reportData.rainfall.data[0];
          if (mainRain && mainRain.max > 0) {
            weatherText = `雨量 ${mainRain.max}mm`;
          }
        }
        document.getElementById('weatherDesc').textContent = weatherText;

        // 天氣警告解析
        const warningsContainer = document.getElementById('weatherWarnings');
        warningsContainer.innerHTML = '';
        let hasWarning = false;

        if (warningData) {
          for (const key in warningData) {
            const warn = warningData[key];
            if (!warn || !warn.actionCode || warn.actionCode === 'CANCELLED') continue;

            hasWarning = true;
            const badge = document.createElement('span');
            badge.className = 'warn-badge ';
            
            // 判斷警告類型並設置相應顏色
            const code = warn.code || key;
            const name = warn.name || '警告';

            if (code.includes('TC') || name.includes('颱風') || name.includes('風球')) {
              badge.classList.add('warn-typhoon');
            } else if (code.includes('RAIN') || name.includes('暴雨')) {
              if (name.includes('黃')) badge.classList.add('warn-amber');
              else if (name.includes('紅')) badge.classList.add('warn-red');
              else if (name.includes('黑')) badge.classList.add('warn-black');
              else badge.classList.add('warn-rain');
            } else {
              badge.classList.add('warn-amber');
            }

            badge.textContent = name;
            warningsContainer.appendChild(badge);
          }
        }

        if (!hasWarning) {
          warningsContainer.innerHTML = '<span class="warn-badge warn-normal">無警告</span>';
        }

      } catch (err) {
        console.error('Weather fetch error:', err);
        document.getElementById('weatherDesc').textContent = '天氣資料暫時未能載入';
      }
    }

    // 初始化天氣獲取，並每 5 分鐘自動更新
    fetchWeather();
    setInterval(fetchWeather, 5 * 60 * 1000);

    // ========== 收藏 & 歷史 ==========
    const LS_FAV = 'hkbus_fav_v1';
    const LS_HIST = 'hkbus_hist_v1';
    const HIST_MAX = 20;
    const FAV_MAX = 30;

    function loadJSON(key, fallback) {
      try {
        const s = localStorage.getItem(key);
        if (!s) return fallback;
        const v = JSON.parse(s);
        return Array.isArray(v) ? v : fallback;
      } catch { return fallback; }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    function routeKey(m, route) {
      return [
        (route || m.route || '').toUpperCase(),
        m.co || '',
        m.bound || '',
        m.serviceType || '1',
        m.nlbRouteId || '',
        m.gmbRouteId || '',
        m.gmbRouteSeq || '',
        m.mtrDir || '',
        m.dirPath || ''
      ].join('|');
    }

    function snapshotRoute(m, route) {
      return {
        key: routeKey(m, route),
        route: (route || m.route || '').toUpperCase(),
        co: m.co,
        bound: m.bound,
        serviceType: m.serviceType || '1',
        label: m.label || '',
        sub: m.sub || '',
        dest: m.dest || '',
        nlbRouteId: m.nlbRouteId || null,
        gmbRouteId: m.gmbRouteId || null,
        gmbRouteSeq: m.gmbRouteSeq || null,
        dirPath: m.dirPath || null,
        mtrDir: m.mtrDir || '',
        at: Date.now()
      };
    }

    function getFavs() { return loadJSON(LS_FAV, []); }
    function getHist() { return loadJSON(LS_HIST, []); }

    function isFav(m, route) {
      const k = routeKey(m, route);
      return getFavs().some(f => f.key === k);
    }

    function toggleFav(m, route) {
      let list = getFavs();
      const k = routeKey(m, route);
      const idx = list.findIndex(f => f.key === k);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.unshift(snapshotRoute(m, route));
        if (list.length > FAV_MAX) list = list.slice(0, FAV_MAX);
      }
      saveJSON(LS_FAV, list);
      return idx < 0;
    }

    function addHistory(m, route) {
      let list = getHist();
      const snap = snapshotRoute(m, route);
      list = list.filter(h => h.key !== snap.key);
      list.unshift(snap);
      if (list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
      saveJSON(LS_HIST, list);
    }

    function clearHistory() {
      saveJSON(LS_HIST, []);
      if (!inputVal) renderHome();
    }

    function clearFavs() {
      if (!confirm('確定清除全部收藏？')) return;
      saveJSON(LS_FAV, []);
      if (!inputVal) renderHome();
      updateHeaderFavBtns();
    }

    function favItemFromState() {
      return {
        route: state.route,
        co: state.co,
        bound: state.bound,
        serviceType: state.serviceType || '1',
        label: state.directionLabel || '',
        sub: '',
        dest: state.directionLabel || '',
        nlbRouteId: state.nlbRouteId,
        gmbRouteId: state.gmbRouteId,
        gmbRouteSeq: state.gmbRouteSeq,
        dirPath: state.dirPath,
        mtrDir: state.mtrDir || ''
      };
    }

    function updateHeaderFavBtns() {
      if (!state.route || !state.co) return;
      const m = favItemFromState();
      const on = isFav(m, state.route);
      ['stopsFavBtn', 'etaFavBtn'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.textContent = on ? '★' : '☆';
        btn.classList.toggle('on', on);
      });
    }

    function toggleFavFromStops() {
      if (!state.route) return;
      const m = favItemFromState();
      toggleFav(m, state.route);
      updateHeaderFavBtns();
    }
    function toggleFavFromEta() {
      toggleFavFromStops();
    }

    function renderSavedItem(item, el, showStar) {
      const div = document.createElement('div');
      div.className = 'result-item';
      const plate = 'plate-' + (item.co || 'kmb');
      const destText = (item.label || '').replace(/^.*?→\s*/, '') || item.dest || item.route;
      const coTag = (item.co === 'nlb' || item.co === 'ctb' || item.co === 'gmb' || item.co === 'mtrbus')
        ? ' - ' + shortCo(item.co) : '';
      const starOn = isFav(item, item.route);
      div.innerHTML =
        '<div class="result-num ' + plate + '">' + item.route + '</div>' +
        '<div class="result-info">' +
          '<div class="result-dest">往 ' + destText + coTag + '</div>' +
          '<div class="result-co">' + (CO_NAMES[item.co] || item.co || '') + (item.sub ? ' · ' + item.sub : '') + '</div>' +
        '</div>' +
        (showStar
          ? '<button class="fav-btn' + (starOn ? ' on' : '') + '" data-fav="1">' + (starOn ? '★' : '☆') + '</button>'
          : '') +
        '<div class="result-arrow">›</div>';
      div.addEventListener('click', e => {
        if (e.target.closest('[data-fav]')) {
          e.stopPropagation();
          toggleFav(item, item.route);
          if (!inputVal) renderHome();
          else {
            const btn = div.querySelector('[data-fav]');
            if (btn) {
              const on = isFav(item, item.route);
              btn.textContent = on ? '★' : '☆';
              btn.classList.toggle('on', on);
            }
          }
          return;
        }
        selectRoute(item, item.route);
      });
      el.appendChild(div);
    }

    function renderHome() {
      const el = document.getElementById('results');
      const favs = getFavs();
      const hist = getHist();
      el.innerHTML = '';
      if (!favs.length && !hist.length) {
        el.innerHTML = '<div class="home-hint">輸入路線號碼開始搜尋<br><small style="opacity:.7">選過的路線會出現在這裡</small></div>';
        return;
      }
      if (favs.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>★ 收藏</span><button class="clear-link" type="button">清除</button>';
        t.querySelector('.clear-link').onclick = clearFavs;
        el.appendChild(t);
        favs.forEach(item => renderSavedItem(item, el, true));
      }
      if (hist.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>最近搜尋</span><button class="clear-link" type="button">清除</button>';
        t.querySelector('.clear-link').onclick = clearHistory;
        el.appendChild(t);
        hist.forEach(item => renderSavedItem(item, el, true));
      }
    }

    let inputVal = '';
    let searchTimer = null;
    let state = {
      co: null, route: null, bound: null, serviceType: null,
      directionLabel: null, stopId: null, stopName: null,
      nlbRouteId: null, gmbRouteId: null, gmbRouteSeq: null,
      dirPath: null, mtrRawStop: null, mtrDir: null,
      auto: false, timer: null
    };

    let cache = { 
      kmbRoutes: null, kmbAt: 0, 
      nlbRoutes: null, nlbAt: 0,
      stopNames: {}
    };
    const TTL = 30 * 60 * 1000;

    // 鍵盤按鍵處理
    document.getElementById('keypad').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const k = btn.dataset.k;
      if (!k) return;

      if (k === 'clear') {
        inputVal = '';
      } else if (k === 'back') {
        inputVal = inputVal.slice(0, -1);
      } else {
        if (inputVal.length < 6) inputVal += k;
      }
      document.getElementById('routeInput').value = inputVal;
      
      if (searchTimer) clearTimeout(searchTimer);
      if (!inputVal) {
        renderHome();
      } else {
        searchTimer = setTimeout(() => onSearchInput(inputVal), 150);
      }
    });

    function shortCo(co) {
      if (co === 'kmb') return '九巴';
      if (co === 'lwb') return '龍運';
      if (co === 'ctb') return '城巴';
      if (co === 'nlb') return '嶼巴';
      if (co === 'gmb') return '小巴';
      if (co === 'mtrbus') return '港鐵巴士';
      return co;
    }

    function onSearchInput(val) {
      if (!val) return;
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '<div class="loading-state">搜尋中...</div>';
      
      // 這裡簡化呼叫，呈現輸入搜尋邏輯
      setTimeout(() => {
        resultsEl.innerHTML = '<div class="empty-state">找到與「' + val + '」相關的路線</div>';
      }, 300);
    }

    function goSearch() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageSearch').classList.add('active');
    }
    function goStops() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageStops').classList.add('active');
    }

    // 初始化渲染首頁
    renderHome();
  </script>
</body>
</html>
